  <!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mango · Gestión de gastos</title>
  <meta name="description" content="Mango — registrá, entendé y mejorá tus gastos personales.">

  <!-- Distinctive Google Fonts: display with character + legible body + mono for amounts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Chart.js (charts) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <!-- The whole SPA renders into #app via the hash router -->
  <div id="app">
    <div class="loader-block" style="min-height:100vh">
      <span class="spinner lg"></span>
      <span class="muted">Cargando Mango…</span>
    </div>
  </div>

  <!-- ==========================================================
       Scripts (vanilla, no framework) — loaded in dependency
       order. Each file attaches to the global `App` namespace.
       ========================================================== -->

  <!-- services: config + mock dataset -->
  <script src="js/services/config.js"></script>
  <script src="js/services/mockData.js"></script>

  <!-- utils -->
  <script src="js/utils/dom.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/utils/validation.js"></script>
  <script src="js/utils/analytics.js"></script>
  <script src="js/utils/store.js"></script>

  <!-- services: api (depends on config + mock) -->
  <script src="js/services/api.js"></script>

  <!-- components -->
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/charts.js"></script>
  <script src="js/components/navbar.js"></script>

  <!-- views -->
  <script src="js/views/auth.js"></script>
  <script src="js/views/expenseForm.js"></script>
  <script src="js/views/expenses.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/ticketUpload.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/consultas.js"></script>
  <script src="js/views/advisor.js"></script>

  <!-- router + bootstrap -->
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
